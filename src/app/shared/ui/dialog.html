<dialog
  #dialogEl
  class="dialog"
  [class.dialog--confirm]="size() === 'confirm'"
  [attr.role]="role()"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-describedby]="describedBy()"
  (close)="closed.emit()"
  (click)="onBackdropClick($event)"
>
  <div class="dialog__panel bg-overlay text-ink" (click)="$event.stopPropagation()">
    <ng-content />
  </div>
</dialog>
