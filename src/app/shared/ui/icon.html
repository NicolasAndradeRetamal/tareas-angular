<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 20 20"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('search') {
      <circle cx="8.5" cy="8.5" r="5.5" />
      <path d="M17 17l-4-4" />
    }
    @case ('x') {
      <path d="M5 5l10 10M15 5L5 15" />
    }
    @case ('plus') {
      <path d="M10 4v12M4 10h12" />
    }
    @case ('sun') {
      <circle cx="10" cy="10" r="3.5" />
      <path
        d="M10 2v2M10 16v2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M2 10h2M16 10h2M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"
      />
    }
    @case ('moon') {
      <path d="M16.5 12.3A7 7 0 1 1 7.7 3.5a5.6 5.6 0 0 0 8.8 8.8Z" />
    }
    @case ('monitor') {
      <rect x="2.5" y="4" width="15" height="10" rx="1.5" />
      <path d="M7 17h6M10 14v3" />
    }
    @case ('check') {
      <path d="M4 10.5l4 4 8-9" />
    }
    @case ('circle-dashed') {
      <circle cx="10" cy="10" r="6.5" stroke-dasharray="3 3" />
    }
    @case ('circle-half') {
      <circle cx="10" cy="10" r="6.5" />
      <path d="M10 3.5a6.5 6.5 0 0 1 0 13Z" fill="currentColor" stroke="none" />
    }
    @case ('circle-check') {
      <circle cx="10" cy="10" r="6.5" />
      <path d="M7 10.2l2 2 4-4.4" />
    }
    @case ('grip') {
      <circle cx="7" cy="5.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="13" cy="5.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="7" cy="10" r="1" fill="currentColor" stroke="none" />
      <circle cx="13" cy="10" r="1" fill="currentColor" stroke="none" />
      <circle cx="7" cy="14.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="13" cy="14.5" r="1" fill="currentColor" stroke="none" />
    }
    @case ('warning') {
      <path d="M10 2 1.5 17h17L10 2Z" stroke-linejoin="round" />
      <path d="M10 8v4" />
      <circle cx="10" cy="14.3" r="0.75" fill="currentColor" stroke="none" />
    }
    @case ('clock') {
      <circle cx="10" cy="10" r="6.5" />
      <path d="M10 6.5V10l2.8 1.8" />
    }
    @case ('calendar') {
      <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
      <path d="M2.5 8h15M6.5 2.5v3M13.5 2.5v3" />
    }
    @case ('more') {
      <circle cx="10" cy="4.5" r="1" fill="currentColor" stroke="none" />
      <circle cx="10" cy="10" r="1" fill="currentColor" stroke="none" />
      <circle cx="10" cy="15.5" r="1" fill="currentColor" stroke="none" />
    }
    @case ('trash') {
      <path
        d="M3.5 5.5h13M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M6 5.5v10a1.5 1.5 0 0 0 1.5 1.5h5a1.5 1.5 0 0 0 1.5-1.5v-10"
      />
      <path d="M8.5 9v4M11.5 9v4" />
    }
    @case ('pencil') {
      <path d="M13.5 3.5 16.5 6.5 6.8 16.2 3 17l0.8-3.8Z" stroke-linejoin="round" />
    }
    @case ('copy') {
      <rect x="7" y="7" width="10" height="10" rx="1.5" />
      <path d="M13 7V4.5A1.5 1.5 0 0 0 11.5 3h-8A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14H7" />
    }
    @case ('menu') {
      <path d="M3 5.5h14M3 10h14M3 14.5h14" />
    }
    @case ('compass') {
      <circle cx="10" cy="10" r="7.5" />
      <path d="M12.8 7.2 11 11l-3.8 1.8L9 9Z" stroke-linejoin="round" />
    }
    @case ('inbox') {
      <path d="M3 11.5 5 4h10l2 7.5" stroke-linejoin="round" />
      <path
        d="M3 11.5h4.2a.5.5 0 0 1 .45.28l.7 1.44a.5.5 0 0 0 .45.28h2.4a.5.5 0 0 0 .45-.28l.7-1.44a.5.5 0 0 1 .45-.28H17V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.5Z"
        stroke-linejoin="round"
      />
    }
    @case ('layout') {
      <rect x="2.5" y="3.5" width="15" height="13" rx="1.5" />
      <path d="M8 3.5v13" />
    }
    @case ('chevron-right') {
      <path d="M7.5 4.5 13 10l-5.5 5.5" />
    }
    @case ('keyboard') {
      <rect x="2.5" y="5" width="15" height="10" rx="1.5" />
      <path d="M5.5 8.5h.01M8.5 8.5h.01M11.5 8.5h.01M14.5 8.5h.01M6 11.5h8" />
    }
    @case ('info') {
      <circle cx="10" cy="10" r="7" />
      <path d="M10 9v4.5M10 6.8v.01" />
    }
    @case ('undo') {
      <path d="M5 8H13a4 4 0 0 1 0 8H9" />
      <path d="M7.5 5 5 8l2.5 3" stroke-linejoin="round" />
    }
  }
</svg>
