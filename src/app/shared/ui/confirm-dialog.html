<app-dialog
  [open]="open()"
  size="confirm"
  role="alertdialog"
  [labelledBy]="titleId"
  [describedBy]="descriptionId"
  (closed)="cancelled.emit()"
>
  <div class="p-6">
    <div class="flex items-center gap-3">
      <svg class="h-5 w-5 shrink-0 text-danger" aria-hidden="true" viewBox="0 0 20 20" fill="none">
        <path
          d="M10 2 1 18h18L10 2Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path d="M10 8v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="10" cy="14.5" r="0.9" fill="currentColor" />
      </svg>
      <h2 [id]="titleId" class="text-lg font-semibold text-ink">{{ title() }}</h2>
    </div>
    <p [id]="descriptionId" class="user-text mt-3 text-base text-ink-muted">{{ message() }}</p>
    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <app-button variant="secondary" size="lg" [autofocus]="true" (clicked)="cancelled.emit()"
        >Cancelar</app-button
      >
      <app-button variant="danger" size="lg" (clicked)="confirmed.emit()">{{
        confirmLabel()
      }}</app-button>
    </div>
  </div>
</app-dialog>
